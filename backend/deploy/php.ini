; PHP settings the deployed RVMS needs (2026-08).
;
; Loaded by pointing PHP_INI_SCAN_DIR at this directory — see nixpacks.toml.
; It applies to EVERY php invocation in the container, which is the point: the
; web server needs it to accept an upload, and `php artisan rvms:doctor` needs
; it to report the truth about that same limit rather than a stale default.
;
; WHY THESE EXIST AT ALL. FR-11 accepts a damage photo up to 5 MB and FR-13/FR-14
; accept a supporting document up to the same. PHP enforces its own limit BEFORE
; Laravel ever sees the request, so with the usual 2M default a driver's photo is
; discarded by PHP and the app never gets the chance to explain why — the exact
; failure reported from testing in August. The container's default here was
; measured at 2M, so this is not hypothetical.
;
; post_max_size is deliberately HIGHER than upload_max_filesize: a request
; carries the file plus its form fields, so equal values still fail an upload
; that is exactly at the limit.

upload_max_filesize = 8M
post_max_size = 10M
