# Railway start configuration.
#
# ⚠ THIS FILE IS ONLY READ WHEN THE SERVICE'S BUILDER IS SET TO NIXPACKS.
# Railway's default builder is now Railpack, which ignores this file entirely
# and substitutes a plan of its own — no migrations on boot, no storage:link,
# and none of the variables below. A build log that opens with
# "using build driver railpack-…" is building WITHOUT any of this. Set
# Settings → Build → Builder to Nixpacks (runbook Part 3.4).
#
# Nixpacks detects Laravel and runs composer install on its own. Only the start
# command needs overriding, because three things have
# to happen on every boot for a deployed RVMS to actually work and none of them
# are automatic:
#
#   1. migrations, so a fresh database gets its tables and a redeploy picks up
#      any new ones. --force because a deploy is non-interactive.
#   2. storage:link, because damage-report photos (FR-11) are served out of
#      public/storage; without the link every photo 404s. Allowed to fail, since
#      it errors when the link already exists — which it will on a volume.
#   3. binding to $PORT on 0.0.0.0. Railway assigns the port and routes to it,
#      so the default 127.0.0.1:8000 is unreachable from outside.
#
# The parentheses matter. Written as `a && b || true && c`, a FAILED MIGRATION
# would be swallowed by the `|| true` and the app would boot against a database
# with no tables. Grouped this way, a failed migration stops the deploy — which
# is what you want to see in the logs — while a redundant storage:link does not.
#
# The scheduled licence and PM sweeps (FR-08, FR-14) are deliberately NOT here.
# They belong to a second Railway service running `php artisan schedule:work`:
# this process restarts on every deploy, and a web server is the wrong place to
# keep a clock.
#
# PHP_INI_SCAN_DIR loads deploy/php.ini, which raises the upload limits so a
# 5 MB damage photo (FR-11) or repair receipt (FR-13/FR-14) is not discarded by
# PHP before Laravel ever sees it. Setting it here rather than with `php -d` in
# the start command is deliberate: it applies to EVERY php process in the
# container, so `php artisan rvms:doctor` reports the same limit the web server
# actually enforces instead of a stale default.
#
# THE LEADING COLON IS LOAD-BEARING. `PHP_INI_SCAN_DIR=/app/deploy` REPLACES the
# default scan directory, which unloads every extension configured there —
# verified in a container: the replace form reported pdo_mysql as NOT loaded,
# i.e. no database at all. `:/app/deploy` APPENDS to the default instead, which
# keeps pdo_mysql and still picks up our file. Do not "tidy" the colon away.

# PHP_CLI_SERVER_WORKERS is what stops `artisan serve` handling one request at a
# time. PHP's built-in server is single-process by default, so a driver's photo
# upload would block every admin's page load until it finished — and this system
# is used by four agencies plus their phones at once (NFR-01). Laravel's serve
# command passes this straight through to the server.

# PHP_INI_SCAN_DIR REPLACES THE DEFAULT SCAN DIR — THE LEADING COLON DOES NOT
# SAVE IT (2026-08-28, proven in the build log).
#
# This file previously stated in capitals that `:/app/deploy` APPENDS to the
# default and keeps the extensions loaded. On this image it does not. The build
# printed the module list both ways, and the difference is the whole story:
#
#   WITH PHP_INI_SCAN_DIR: Core date hash json libxml pcre Phar random
#                          Reflection SPL standard xml
#   WITHOUT:               … ctype curl dom fileinfo iconv mbstring openssl
#                          pdo_mysql tokenizer zip … (and 30 more)
#
# The twelve that survive are the ones PHP compiles in statically. Everything
# else — including pdo_mysql, so no database at all — loads from .ini files in
# the scan directory, and pointing that directory at /app/deploy leaves them
# unread. Colon or no colon.
#
# It broke two things and they looked unrelated. At BUILD time Composer could
# not start ("The iconv OR mbstring extension is required and both are
# missing") while the same log downloaded php-mbstring and php-iconv. At RUN
# time the container crash-looped on `Class "DOMDocument" not found` and
# `Call to undefined function token_get_all()`.
#
# WHY NOBODY SAW IT UNTIL A SECOND SERVICE EXISTED. The web service has never
# built cold since PHP_INI_SCAN_DIR arrived in d1edc76 — Docker keeps reusing
# its layer-8 cache — and it has no public domain yet, so nothing has ever
# asked it to serve a request. It reports Online because the container starts.
# The scheduler crashes visibly only because schedule:work touches PHP at once.
#
# THE FIX: make /app/deploy self-sufficient. Nix's extension .ini files are
# copied into it during the build, so scanning that one directory loads the
# extensions AND our upload limits. The variable can then point at it plainly,
# which is what it does below. Nothing is appended and nothing is lost.
#
# The last install command is an ASSERTION, not a diagnostic. It re-runs PHP
# with the real runtime configuration and fails the build unless pdo_mysql,
# mbstring, dom and tokenizer are all loaded and the upload limit really is 8M.
# A container that cannot load its extensions can no longer reach a deploy —
# which is the actual lesson here, because this one did, twice.

[phases.install]
cmds = [
    "mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx",
    "echo \"WITH PHP_INI_SCAN_DIR: $(php -m | tr '\\n' ' ')\"",
    "echo \"WITHOUT: $(env -u PHP_INI_SCAN_DIR php -m | tr '\\n' ' ')\"",
    "NIXINI=$(env -u PHP_INI_SCAN_DIR php -i | sed -n 's/^Scan this dir for additional .ini files => //p') && echo \"NIX INI DIR: $NIXINI\" && cp -v \"$NIXINI\"/*.ini /app/deploy/",
    "for e in pdo_mysql mbstring dom tokenizer openssl curl zip; do PHP_INI_SCAN_DIR=/app/deploy php -m | grep -qw \"$e\" || { echo \"FATAL: $e not loaded from /app/deploy\"; exit 1; }; done && echo \"VERIFIED extensions + upload_max_filesize=$(PHP_INI_SCAN_DIR=/app/deploy php -r 'echo ini_get(\"upload_max_filesize\");')\"",
    "env -u PHP_INI_SCAN_DIR php -r \"copy('https://getcomposer.org/composer-stable.phar', '/tmp/composer.phar');\"",
    "env -u PHP_INI_SCAN_DIR php /tmp/composer.phar install --ignore-platform-reqs --no-interaction --no-progress",
    "npm i",
]

[variables]
PHP_INI_SCAN_DIR = "/app/deploy"
PHP_CLI_SERVER_WORKERS = "4"

[start]
cmd = "php artisan migrate --force && (php artisan storage:link || true) && php artisan serve --host=0.0.0.0 --port=$PORT"
