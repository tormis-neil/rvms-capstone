name: Build Driver APK

# Builds the RVMS driver app into an installable debug APK in the cloud, so it
# can be downloaded from the browser without Android Studio or the source on a
# local machine. Runs automatically when the mobile app changes on this branch,
# and can also be started by hand from the Actions tab (Run workflow).
on:
  workflow_dispatch:
  push:
    branches:
      - claude/fcm-railway-debug-3uds7o
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # JDK 21 — the app sets sourceCompatibility = VERSION_21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Installs the Android command-line tools and accepts the SDK licenses;
      # AGP then downloads platform 36 / build-tools as needed during the build.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: mobile

      # google-services.json is not in the repo, so the FCM plugin stays
      # disabled and the build succeeds without Firebase config. Push
      # notifications will not work in THIS test APK; everything else (the
      # password reveal toggle, the primary/secondary role labels, sign-in,
      # inspections, damage reports, My Vehicle) does.
      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: mobile

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: rvms-driver-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
